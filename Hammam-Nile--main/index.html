            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          };
          try {

                Object.defineProperty(Window.prototype, 'fetch', descriptor);
              } catch (e2) {}
